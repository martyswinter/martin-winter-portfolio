name: Deploy portfolio to netcup

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy files to netcup via FTPS
        run: |
          lftp --env-password -u "$FTP_USER" -e '
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate no
            open -p 21 ftp://159.195.152.17
            mirror --reverse --verbose --exclude-glob .git/ --exclude-glob .github/ ./ /hosting253370.a9811.netcup.net/httpdocs/
            bye
          '
        env:
          FTP_USER: ${{ secrets.NETCUP_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.NETCUP_FTP_PASSWORD }}
