      - name: Deploy files to netcup via FTPS
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          lftp -e "
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate no
            open -p 21 -u \"$FTP_USER\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"
            mirror --reverse --verbose --exclude-glob .git/ --exclude-glob .github/ ./ /hosting253370.a9811.netcup.net/httpdocs/
            bye
          "
        env:
          FTP_SERVER: ${{ secrets.NETCUP_FTP_SERVER }}
          FTP_USER: ${{ secrets.NETCUP_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.NETCUP_FTP_PASSWORD }}
