name: Test netcup FTPS connection

on:
  workflow_dispatch:

jobs:
  ftp-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Test netcup FTPS connection
        run: |
          lftp --env-password -u "$FTP_USER" -p 21 -e '
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ssl:verify-certificate no
            set net:timeout 20
            set net:max-retries 1
            set cmd:fail-exit true
            cd /hosting253370.a9811.netcup.net/httpdocs
            ls
            bye
          ' "ftp://159.195.152.17"
        env:
          FTP_USER: ${{ secrets.NETCUP_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.NETCUP_FTP_PASSWORD }}
